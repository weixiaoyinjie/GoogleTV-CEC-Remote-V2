name: Build Google TV CEC Remote V3.2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V3 source code
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="GoogleTV-CEC-Remote-V3.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Missing $ZIP_FILE in repository root"
            exit 1
          fi
          unzip -tq "$ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/cec-src"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/cec-src"
          SETTINGS_FILE=$(find "$RUNNER_TEMP/cec-src" -type f -name settings.gradle -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply V3.2 projector and S61B diagnostics patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          project = Path(sys.argv[1])
          base = project / 'app/src/main/java/com/cecbridge/remotev2'
          proto = base / 'Proto.java'
          remote = base / 'RemoteSession.java'
          ui = base / 'MainActivity.java'
          gradle = project / 'app/build.gradle'

          def replace_once(s, old, new, what):
              if s.count(old) != 1:
                  raise SystemExit(f'::error::Expected exactly one occurrence of {what}, found {s.count(old)}')
              return s.replace(old, new, 1)

          # Fix V3's protobuf parser; V3.1 fixed this, but the repo still contains V3.
          s = proto.read_text()
          old='''                int count = in.read(payload);
                          if (count != payload.length) throw new IOException("Short protobuf payload");'''
          new='''                if (payload.length > 0) {
                              int count = in.read(payload);
                              if (count != payload.length) throw new IOException("Short protobuf payload");
                          }'''
          if old in s:
              s=replace_once(s,old,new,'empty protobuf fix')
          elif new not in s:
              raise SystemExit('::error::Unexpected Proto.java; cannot apply empty protobuf fix')
          proto.write_text(s)

          s=remote.read_text()
          s=replace_once(s,
          '''        void powerState(Boolean isOn);
          ''',
          '''        void powerState(Boolean isOn);
                  default void volumeState(int level, int max, boolean muted) { }
          ''','volume status listener')
          s=replace_once(s,
          '''                } else if (Proto.has(packet, 3)) {
                              listener.status("电视报告遥控协议错误，请重新配对");''',
          '''                } else if (Proto.has(packet, 50)) { // RemoteSetVolumeLevel from TV
                              Map<Integer, Object> v = Proto.sub(packet, 50);
                              listener.volumeState((int) Proto.number(v, 7),
                                      (int) Proto.number(v, 6), Proto.number(v, 8) != 0);
                          } else if (Proto.has(packet, 3)) {
                              listener.status("电视报告遥控协议错误，请重新配对");''','volume message handler')
          s=replace_once(s,
          '''    public void sendKey(int androidKeyCode) throws IOException {
                  if (!isReady()) throw new IOException("Google TV 未完成连接");
                  // Android RemoteKeyInject { key_code = 1, direction = 2 (SHORT=3) }
                  sendPacket(Proto.bytes(10, Proto.cat(Proto.uint(1, androidKeyCode), Proto.uint(2, 3))));
              }
          ''',
          '''    private void sendKeyDirection(int androidKeyCode, int direction) throws IOException {
                  if (!isReady()) throw new IOException("Google TV 未完成连接");
                  // Android RemoteKeyInject: START_LONG=1, END_LONG=2, SHORT=3.
                  sendPacket(Proto.bytes(10, Proto.cat(Proto.uint(1, androidKeyCode), Proto.uint(2, direction))));
              }

              public void sendKey(int androidKeyCode) throws IOException {
                  sendKeyDirection(androidKeyCode, 3);
              }

              /** Optional protocol diagnostic; a long press is NOT a direct CEC command. */
              public void sendKeyLongPress(int androidKeyCode, int durationMillis) throws IOException {
                  sendKeyDirection(androidKeyCode, 1);
                  try {
                      Thread.sleep(Math.max(150, Math.min(durationMillis, 600)));
                  } catch (InterruptedException e) {
                      Thread.currentThread().interrupt();
                  } finally {
                      sendKeyDirection(androidKeyCode, 2);
                  }
              }
          ''','directional keys and long press')
          remote.write_text(s)

          s=ui.read_text()
          s=replace_once(s,
          '''    private TextView statusView, powerView;''',
          '''    private TextView statusView, powerView, volumeView;''','volume UI field')
          s=replace_once(s,
          '''            @Override public void powerState(Boolean state) {
                          runOnUiThread(() -> powerView.setText(state == null ? "Google TV 状态：未知"
                                  : state ? "Google TV 状态：正在运行" : "Google TV 状态：待机"));
                      }
                  });
              }
          ''',
          '''            @Override public void powerState(Boolean state) {
                          runOnUiThread(() -> powerView.setText(state == null ? "Google TV 状态：未知"
                                  : state ? "Google TV 状态：正在运行" : "Google TV 状态：待机"));
                      }
                      @Override public void volumeState(int level, int max, boolean muted) {
                          runOnUiThread(() -> {
                              if (volumeView != null) {
                                  volumeView.setText(max > 0
                                          ? "Google TV 报告音量：" + level + "/" + max + (muted ? "（静音）" : "")
                                          : "Google TV 报告音量信息（未提供最大值）");
                              }
                          });
                      }
                  });
              }
          ''','remote volume UI callback')
          start=s.index('        root.addView(label("投影机电源（CEC 联动）"')
          end=s.index('        root.addView(label("Google TV 本机电源"',start)
          s=s[:start]+'''        root.addView(label("投影机电源（CEC 测试）", 17, LIGHT, true));
                  powerView = label("Google TV 状态：未知（不是投影机状态）", 12, ACCENT, false);
                  root.addView(powerView);
                  space(root, 10);
                  button(root, "投影机 / 显示设备电源切换（TV_POWER 177）", GREEN, 0,
                          () -> key(177, "TV_POWER 177（显示设备电源切换）"));
                  space(root, 9);
                  LinearLayout projRow = row(root);
                  button(projRow, "HOME 唤醒测试", PANEL, 1, () -> key(3, "HOME（CEC 唤醒测试）"));
                  button(projRow, "POWER 26 联动", PANEL, 1, () -> key(26, "POWER 26（原方式）"));
                  space(root, 8);
                  root.addView(label("177 是显示设备电源切换，不是独立开/关指令。HOME 可能触发一键播放唤醒；这些指令是否触发投影机 CEC 取决于 Google TV 系统。", 12, SUB, false));
                  space(root, 24);

          '''+s[end:]
          start=s.index('        root.addView(label("S61B 音量"')
          end=s.index('        root.addView(label("媒体播放"',start)
          s=s[:start]+'''        root.addView(label("S61B 音量（系统转发测试）", 17, LIGHT, true));
                  root.addView(label("先试短按；不生效再试模拟长按。仅 Google TV 处理并转发 CEC 时，S61B 才会改变音量。", 12, SUB, false));
                  volumeView = label("Google TV 返回音量：尚无报告", 12, ACCENT, false);
                  root.addView(volumeView);
                  space(root, 9);
                  LinearLayout volRow = row(root);
                  button(volRow, "− 音量", PANEL, 1, () -> key(25, "音量减 25"));
                  button(volRow, "+ 音量", PANEL, 1, () -> key(24, "音量加 24"));
                  space(root, 9);
                  LinearLayout longRow = row(root);
                  button(longRow, "长按 − 测试", PANEL, 1, () -> longKey(25, "音量减"));
                  button(longRow, "长按 + 测试", PANEL, 1, () -> longKey(24, "音量加"));
                  space(root, 9);
                  button(root, "静音 / 取消静音（164）", PANEL, 0, () -> key(164, "静音 164"));
                  space(root, 9);
                  button(root, "备用静音（91）", PANEL, 0, () -> key(91, "备用静音 91"));
                  space(root, 9);
                  root.addView(label("音量反馈来自 Google TV 的软件音量，不等于 S61B 实际音量。请用回音壁的指示或声音确认。", 12, SUB, false));
                  space(root, 24);

          '''+s[end:]

          needle='''    private void powerSet(boolean targetOn) {'''
          if needle not in s:
              raise SystemExit('::error::Old powerSet() handler was not found')
          # Old powerSet used Google TV status to falsely claim that projector is on/off.
          start=s.index(needle)
          end=s.index('    private void ensureConnected(',start)
          s=s[:start]+'''    private void longKey(int keyCode, String name) {
                  String host = saveHost();
                  if (host == null) return;
                  io.execute(() -> {
                      try {
                          ensureConnected(host);
                          remote.sendKeyLongPress(keyCode, 350);
                          showStatus("已发送长按「" + name + "」测试，请观察 S61B 实际音量", false);
                      } catch (Exception ex) { showStatus("长按「" + name + "」失败：" + ex.getMessage(), true); }
                  });
              }

          '''+s[end:]
          ui.write_text(s)

          s=gradle.read_text()
          s=s.replace('versionCode 3','versionCode 5').replace("versionName '3.0-test'","versionName '3.2-cec-diagnostics'")
          if 'versionCode 5' not in s: raise SystemExit('::error::Build version was not updated')
          if 'META-INF/versions/9/OSGI-INF/MANIFEST.MF' not in s:
              s += """\nandroid {
              packaging {
                  resources {
                      excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
                  }
              }
          }
          """
          gradle.write_text(s)
          print('V3.2 patch applied to:',project)
          PY

      - name: Verify remote protobuf messages
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ProtoTest.java" <<'JAVA'
          package com.cecbridge.remotev2;
          import java.util.*;
          public class ProtoTest {
            public static void main(String[] args) throws Exception {
              for (int f : new int[]{11,31,41}) {
                byte[] pkt=Proto.cat(Proto.uint(1,2),Proto.bytes(f,new byte[0]));
                if(!Proto.has(Proto.parse(pkt),f)) throw new AssertionError("Zero-length ACK " + f);
              }
              for(int code : new int[]{3,24,25,26,91,164,177,223,224}) {
                for(int direction : new int[]{1,2,3}) {
                  byte[] pkt=Proto.bytes(10,Proto.cat(Proto.uint(1,code),Proto.uint(2,direction)));
                  Map<Integer,Object> inner=Proto.sub(Proto.parse(pkt),10);
                  if(Proto.number(inner,1)!=code || Proto.number(inner,2)!=direction)
                    throw new AssertionError("RemoteKeyInject " + code + "/" + direction);
                }
              }
              System.out.println("Protobuf ACK and key injection smoke tests passed");
            }
          }
          JAVA
          mkdir -p "$RUNNER_TEMP/prototest"
          javac -d "$RUNNER_TEMP/prototest" "$PROJECT_DIR/app/src/main/java/com/cecbridge/remotev2/Proto.java" "$RUNNER_TEMP/ProtoTest.java"
          java -cp "$RUNNER_TEMP/prototest" com.cecbridge.remotev2.ProtoTest

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug --stacktrace
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTV-CEC-Remote-V3.2-APK
          path: app-debug.apk
          if-no-files-found: error
