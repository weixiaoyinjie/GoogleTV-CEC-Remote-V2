
name: Build Google TV CEC Remote V3 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V3 source code
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="GoogleTV-CEC-Remote-V3.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Missing $ZIP_FILE in repository root"
            exit 1
          fi
          unzip -tq "$ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/cec-src"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/cec-src"
          SETTINGS_FILE=$(find "$RUNNER_TEMP/cec-src" -type f -name settings.gradle -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix duplicate Bouncy Castle metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/app/build.gradle"
          cat >> "$PROJECT_DIR/app/build.gradle" <<'GRADLE'

          android {
              packaging {
                  resources {
                      excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
                  }
              }
          }
          GRADLE

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug --stacktrace
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTV-CEC-Remote-V3-APK
          path: app-debug.apk
          if-no-files-found: error
