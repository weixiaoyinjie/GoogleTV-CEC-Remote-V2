
name: Build Google TV CEC Remote V3 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V3 source code
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f GoogleTV-CEC-Remote-V3.zip ]; then
            echo "::error::请先把 GoogleTV-CEC-Remote-V3.zip 上传到仓库根目录"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cec-src"
          unzip -q GoogleTV-CEC-Remote-V3.zip -d "$RUNNER_TEMP/cec-src"
          settings_file=$(find "$RUNNER_TEMP/cec-src" -type f -name settings.gradle -print -quit)
          if [ -z "$settings_file" ]; then
            echo "::error::ZIP 内未找到 settings.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$settings_file")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTV-CEC-Remote-V3-APK
          path: app-debug.apk
          if-no-files-found: error
