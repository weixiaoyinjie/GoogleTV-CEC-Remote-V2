
name: Build Google TV CEC Remote V3 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V3 source code
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="GoogleTV-CEC-Remote-V3.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::请先在仓库根目录上传 $ZIP_FILE"
            exit 1
          fi
          unzip -tq "$ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/cec-src"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/cec-src"
          SETTINGS_FILE=$(find "$RUNNER_TEMP/cec-src" -type f -name settings.gradle -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::ZIP 内未找到 settings.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || {
            echo "::error::Android API 35 is missing on runner"
            exit 1
          }
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" || {
            echo "::error::Android Build Tools 35.0.0 are missing on runner"
            exit 1
          }
          echo "Android SDK 35 is ready."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug --stacktrace
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTV-CEC-Remote-V3-APK
          path: app-debug.apk
          if-no-files-found: error
