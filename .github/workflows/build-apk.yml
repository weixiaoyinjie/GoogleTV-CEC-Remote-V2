name: Build Google TV Remote Hub V4.2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Google TV Remote Hub V4.2
        shell: bash
        run: |
          set -euo pipefail
          ZIP="GoogleTV-Remote-Hub-V4.2.zip"
          test -f "$ZIP" || { echo "::error::Upload $ZIP to the repository root"; exit 1; }
          unzip -tq "$ZIP"
          mkdir -p "$RUNNER_TEMP/gtv-v4-2"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/gtv-v4-2"
          SETTINGS=$(find "$RUNNER_TEMP/gtv-v4-2" -type f -name settings.gradle -print -quit)
          test -n "$SETTINGS" || { echo "::error::settings.gradle not found"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify installed Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug --stacktrace
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GoogleTV-Remote-Hub-V4.2-APK
          path: app-debug.apk
          if-no-files-found: error
